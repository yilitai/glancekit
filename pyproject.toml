[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "glancekit"
version = "0.2.0"
description = "Utilities for single-cell and spatial proteomics data processing"
requires-python = ">=3.10"

dependencies = [
    "numpy>=1.26,<3",
    "pandas>=2.1,<4",
    "requests>=2.31,<3",
    "anndata>=0.11,<0.14",
    "scipy>=1.12,<2",
    "polars>=1.44.2,<2; python_version < '3.11'",
    "polars>=2.1,<3; python_version >= '3.11'",
    "pyarrow>=20,<27",
    "tifffile>=2024.1",
    "matplotlib>=3.8,<4",
]

[project.optional-dependencies]
extras = [
    "tqdm>=4.66,<5",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["glancekit", "glancekit.*"]